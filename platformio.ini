; tinytram: next trams at one Amsterdam stop, for the Waveshare
; ESP32-S3-Touch-AMOLED-1.75 round board. Board layer copied from tinyarcana.
; Build: pio run   Flash: pio run -t upload   (read the MAC first, AGENTS.md)
[platformio]
default_envs = amoled-175-round

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
lib_deps =
    moononournation/GFX Library for Arduino@^1.6.7
    lewisxhe/XPowersLib@^0.2.7
    bblanchon/ArduinoJson@^7.4.2

[env:amoled-175-round]
build_flags =
    -DBOARD_ROUND_175
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -O2
